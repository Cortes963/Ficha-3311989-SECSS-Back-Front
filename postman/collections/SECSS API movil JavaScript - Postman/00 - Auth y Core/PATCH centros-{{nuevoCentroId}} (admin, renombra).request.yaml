$kind: http-request
name: PATCH centros/{{nuevoCentroId}} (admin, renombra)
url: "{{baseUrl}}/api/mobile/v1/core/centros/{{nuevoCentroId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: json
  content: |-
    {
      "nombre_centro": "Centro de Pruebas Postman (renombrado)"
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 12000

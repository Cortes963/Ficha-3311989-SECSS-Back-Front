$kind: http-request
url: "{{baseUrl}}/api/core/centros"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenInvitado}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenJefe}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
body:
  type: json
  content: |-
    {
      "nombre_centro": "{{nombreCentroPrueba}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      let j={}; try {j=pm.response.json();} catch(e) {}
      if (j.datos && j.datos.id) pm.environment.set("nuevoCentroId", String(j.datos.id));
    language: text/javascript
order: 2000

$kind: http-request
name: PATCH vehicle/{{nuevoVehiculoId}} (invitado ajeno, esperado 404)
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenInvitadoSemilla}}
body:
  type: json
  content: |-
    {
      "color": "Verde"
    }
scripts:
  - type: afterResponse
    code: pm.test("404 esperado", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 7000

$kind: http-request
name: PUT reportes/{{nuevoReporteId}} (celador corrige dentro de la ventana de edicion)
description: EDIT_WINDOW_MINUTES (5 min por defecto) limita cuanto tiempo despues de crear el reporte se puede editar; si corres esta request mucho despues de crear el reporte, esperaras 409 en vez de 200.
url: "{{baseUrl}}/api/mobile/v1/reportes/{{nuevoReporteId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCelador}}
body:
  type: json
  content: |-
    {
      "cuerpo": "Se encontro una moto obstruyendo la salida de emergencia; ya fue retirada."
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000

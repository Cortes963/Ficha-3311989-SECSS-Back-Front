$kind: http-request
name: POST input_output invitado (celador crea invitado, vehiculo y entrada)
url: "{{baseUrl}}/api/input_output/invitado"
method: POST
headers:
  Authorization: Bearer {{tokenCelador}}
body:
  type: formdata
  content:
    - type: text
      key: tipo_documento
      value: CC
    - type: text
      key: numero_documento
      value: "{{docInvitadoNuevo}}"
    - type: text
      key: primer_nombre
      value: Visitante
    - type: text
      key: primer_apellido
      value: Postman
    - type: text
      key: n_celular
      value: 320{{$timestamp}}
    - type: text
      key: correo
      value: invitado.postman.{{$timestamp}}@test.com
    - type: text
      key: expira_en
      value: 2027-12-31T23:59
    - type: text
      key: tipo_vehiculo
      value: BICICLETA
    - type: text
      key: marca
      value: GW
    - type: text
      key: color
      value: Azul
scripts:
  - type: beforeRequest
    code: pm.environment.set('docInvitadoNuevo', String(Date.now()) + '2');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("201 creado", () => pm.response.to.have.status(201));
      const data = pm.response.json();
      pm.environment.set('nuevoInvitadoId', data.id_usuario);
      if (data.credenciales_temporales) pm.environment.set('passwordInvitadoNuevo', data.credenciales_temporales.password);
    language: text/javascript
order: 2000

$kind: http-request
name: POST pqrs/{{nuevaPqrsId}}/respuesta (admin responde)
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}/respuesta"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: json
  content: |-
    {
      "asunto": "Respuesta a demora en cupo",
      "cuerpo": "Su cupo fue aprobado el dia de hoy."
    }
scripts:
  - type: afterResponse
    code: pm.test("201 creado", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 13000

$kind: http-request
name: PATCH users id estado (admin rehabilita al aprendiz nuevo) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/users/{{nuevoAprendizId}}/estado"
method: PATCH
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000

$kind: http-request
url: "{{baseUrl}}/api/users/{{nuevoAprendizId}}/estado"
method: PATCH
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": 0
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000

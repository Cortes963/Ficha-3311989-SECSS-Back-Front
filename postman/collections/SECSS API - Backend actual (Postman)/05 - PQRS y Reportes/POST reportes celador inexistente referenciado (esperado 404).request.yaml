$kind: http-request
url: "{{baseUrl}}/api/reportes"
method: POST
headers:
  Authorization: Bearer {{tokenCelador}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_usuario_celador": 999999,
      "asunto": "x",
      "cuerpo": "y"
    }
scripts:
  - type: afterResponse
    code: pm.test("404 celador no existe", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000

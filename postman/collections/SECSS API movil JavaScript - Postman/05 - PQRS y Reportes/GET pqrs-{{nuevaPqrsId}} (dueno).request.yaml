$kind: http-request
name: GET pqrs/{{nuevaPqrsId}} (dueno)
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 10000

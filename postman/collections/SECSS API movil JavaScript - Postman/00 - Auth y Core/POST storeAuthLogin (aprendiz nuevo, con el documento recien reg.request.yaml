$kind: http-request
name: POST storeAuthLogin (aprendiz nuevo, con el documento recien registrado)
url: "{{baseUrl}}/api/mobile/v1/auth/storeAuthLogin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numero_documento": "{{docAprendizNuevo}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", function () { pm.response.to.have.status(200); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.token) pm.environment.set("tokenAprendizNuevo", json.token);
      if (json.usuario && json.usuario.id) pm.environment.set("idAprendizNuevo", json.usuario.id);
    language: text/javascript
order: 15000

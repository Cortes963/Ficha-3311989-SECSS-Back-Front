$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "token-que-no-existe",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("400 esperado", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 19000

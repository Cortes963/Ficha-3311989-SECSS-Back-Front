$kind: http-request
name: POST input_output/entrada (aprendiz usa endpoint de celador, esperado 403)
url: "{{baseUrl}}/api/mobile/v1/input_output/entrada"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "id_usuario_entra": "{{idAprendizNuevo}}",
      "id_vehiculo": "{{nuevoVehiculoId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 esperado", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000

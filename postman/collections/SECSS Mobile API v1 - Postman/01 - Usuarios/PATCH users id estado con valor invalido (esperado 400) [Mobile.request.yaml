$kind: http-request
name: PATCH users id estado con valor invalido (esperado 400) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/users/{{nuevoAprendizId}}/estado"
method: PATCH
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": 9
    }
scripts:
  - type: afterResponse
    code: pm.test("400 estado invalido", () => pm.response.to.have.status(400));
    language: text/javascript
order: 10000

$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/auth/storeAuthRegister"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: tipo_documento
      value: CC
    - type: text
      key: numero_documento
      value: "900000001"
    - type: text
      key: primer_nombre
      value: Intento
    - type: text
      key: primer_apellido
      value: Invalido
    - type: text
      key: n_celular
      value: "3000000000"
    - type: text
      key: correo
      value: intento.invalido@example.com
    - type: text
      key: password
      value: "{{testPassword}}"
    - type: text
      key: nombre_rol
      value: ADMINISTRADOR
scripts:
  - type: afterResponse
    code: pm.test("403 esperado", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 16000

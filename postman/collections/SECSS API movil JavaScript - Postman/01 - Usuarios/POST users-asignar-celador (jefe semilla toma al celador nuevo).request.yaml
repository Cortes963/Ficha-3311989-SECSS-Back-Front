$kind: http-request
name: POST users/asignar-celador (jefe semilla toma al celador nuevo)
description: id_usuario_jefe_seguridad e id_usuario_celador son IDs numericos de usuario, no numeros de documento. idJefe se captura automaticamente al hacer login del jefe en la carpeta 00.
url: "{{baseUrl}}/api/mobile/v1/users/asignar-celador"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenJefe}}
body:
  type: json
  content: |-
    {
      "id_usuario_jefe_seguridad": "{{idJefe}}",
      "id_usuario_celador": "{{nuevoCeladorId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("201 creado", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 21000

$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/vehicle"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "tipo_vehiculo": "CARRO",
      "marca": "Cualquiera",
      "color": "Negro"
    }
scripts:
  - type: afterResponse
    code: pm.test("400 esperado", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000

$kind: http-request
name: PATCH users/me (aprendiz nuevo actualiza celular)
url: "{{baseUrl}}/api/mobile/v1/users/me"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "n_celular": "3009998877"
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000

$kind: http-request
name: PATCH vehicle id (aprendiz nuevo actualiza su propio vehiculo) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}"
method: PATCH
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: formdata
  content:
    - type: text
      key: color
      value: Negro
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("avisa revision pendiente", () => pm.expect(pm.response.json().mensaje.toLowerCase()).to.match(/revisi/));
    language: text/javascript
order: 5000

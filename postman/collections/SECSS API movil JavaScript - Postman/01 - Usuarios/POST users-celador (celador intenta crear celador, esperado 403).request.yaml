$kind: http-request
name: POST users/celador (celador intenta crear celador, esperado 403)
url: "{{baseUrl}}/api/mobile/v1/users/celador"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCelador}}
body:
  type: json
  content: |-
    {
      "id_usuario": "{{nuevoAprendizId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 esperado", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 19000

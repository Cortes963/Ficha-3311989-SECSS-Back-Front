$kind: http-request
name: PATCH input_output/salida/{{nuevaEntradaId}} (celador cierra la entrada)
url: "{{baseUrl}}/api/mobile/v1/input_output/salida/{{nuevaEntradaId}}"
method: PATCH
headers:
  Authorization: Bearer {{tokenCelador}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000

$kind: http-request
name: POST input_output entrada (celador registra entrada de Diego con cupo activo)
url: "{{baseUrl}}/api/input_output/entrada"
method: POST
headers:
  Authorization: Bearer {{tokenCelador}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_usuario_entra": 5,
      "id_vehiculo": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", () => pm.response.to.have.status(201));
      pm.environment.set('nuevaEntradaId', pm.response.json().id_entrada_salida);
    language: text/javascript
order: 3000

$kind: http-request
name: PATCH input_output salida id (celador cierra la entrada creada arriba) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/input_output/salida/{{nuevaEntradaId}}"
method: PATCH
headers:
  Authorization: Bearer {{tokenCelador}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000

$kind: http-request
url: "{{baseUrl}}/api/users?pagina=1&limite=20"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
queryParams:
  pagina: "1"
  limite: "20"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000

$kind: http-request
url: "{{baseUrl}}/api/auth/storeAuthLogin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numero_documento": "{{docAdmin}}",
      "password": "clave-incorrecta-cualquiera"
    }
scripts:
  - type: afterResponse
    code: pm.test("401 credenciales invalidas", () => pm.response.to.have.status(401));
    language: text/javascript
order: 9000

$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/pqrs"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "asunto": "Demora en aprobacion de cupo",
      "cuerpo": "Mi cupo lleva 3 dias pendiente de aprobacion."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", function () { pm.response.to.have.status(201); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.id_pqrs) pm.environment.set("nuevaPqrsId", json.id_pqrs);
    language: text/javascript
order: 7000

$kind: http-request
url: "{{baseUrl}}/api/vehicle/me"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizSemilla}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test("al menos un vehiculo", () => pm.expect(pm.response.json().datos.length).to.be.above(0));
      }
    language: text/javascript
order: 1000

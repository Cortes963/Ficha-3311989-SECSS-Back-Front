$kind: http-request
description: Con PASSWORD_RESET_RETURN_TOKEN=true en el .env del Backend, la respuesta incluye 'token' en texto plano para poder encadenar reset-password sin leer la base de datos.
url: "{{baseUrl}}/api/mobile/v1/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "cambiar-por-un-correo-real-de-la-DML@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", function () { pm.response.to.have.status(200); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.token) pm.environment.set("resetToken", json.token);
    language: text/javascript
order: 18000

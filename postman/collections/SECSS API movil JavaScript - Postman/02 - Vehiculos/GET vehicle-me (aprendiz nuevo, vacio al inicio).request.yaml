$kind: http-request
name: GET vehicle/me (aprendiz nuevo, vacio al inicio)
url: "{{baseUrl}}/api/mobile/v1/vehicle/me"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000

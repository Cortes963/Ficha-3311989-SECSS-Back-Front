$kind: http-request
name: PATCH users/me/password (aprendiz nuevo cambia su clave)
url: "{{baseUrl}}/api/mobile/v1/users/me/password"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "password_actual": "{{testPassword}}",
      "password_nueva": "{{testPassword}}Nueva1"
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000

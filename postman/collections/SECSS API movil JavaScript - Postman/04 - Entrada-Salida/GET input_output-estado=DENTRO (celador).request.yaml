$kind: http-request
name: GET input_output?estado=DENTRO (celador)
url: "{{baseUrl}}/api/mobile/v1/input_output?estado=DENTRO"
method: GET
headers:
  Authorization: Bearer {{tokenCelador}}
queryParams:
  estado: DENTRO
scripts:

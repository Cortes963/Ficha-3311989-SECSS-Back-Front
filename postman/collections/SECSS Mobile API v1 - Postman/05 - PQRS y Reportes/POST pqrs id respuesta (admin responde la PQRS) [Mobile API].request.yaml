$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}/respuesta"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "asunto": "Respuesta",
      "cuerpo": "Su solicitud fue atendida."
    }
scripts:
  - type: afterResponse
    code: pm.test("201 creado", () => pm.response.to.have.status(201));
    language: text/javascript
order: 10000

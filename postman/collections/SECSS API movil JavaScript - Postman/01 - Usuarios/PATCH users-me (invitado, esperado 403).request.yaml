$kind: http-request
name: PATCH users/me (invitado, esperado 403)
url: "{{baseUrl}}/api/mobile/v1/users/me"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenInvitadoSemilla}}
body:
  type: json
  content: |-
    {
      "n_celular": "3000000000"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 esperado (invitados no editan perfil)", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000

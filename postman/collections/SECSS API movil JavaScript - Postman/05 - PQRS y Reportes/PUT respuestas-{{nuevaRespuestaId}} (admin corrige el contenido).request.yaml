$kind: http-request
name: PUT respuestas/{{nuevaRespuestaId}} (admin corrige el contenido)
description: Tambien sujeto a EDIT_WINDOW_MINUTES desde que se creo la respuesta.
url: "{{baseUrl}}/api/mobile/v1/respuestas/{{nuevaRespuestaId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: json
  content: |-
    {
      "asunto": "Respuesta a demora en cupo (corregida)",
      "cuerpo": "Su cupo fue aprobado el dia de hoy; disculpe la demora."
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 19000

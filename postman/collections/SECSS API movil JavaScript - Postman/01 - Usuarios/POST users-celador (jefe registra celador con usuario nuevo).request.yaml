$kind: http-request
name: POST users/celador (jefe registra celador con usuario nuevo)
url: "{{baseUrl}}/api/mobile/v1/users/celador"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenJefe}}
body:
  type: json
  content: |-
    {
      "usuario": {
        "tipo_documento": "CC",
        "numero_documento": "{{$timestamp}}",
        "primer_nombre": "Celador",
        "primer_apellido": "DePrueba",
        "n_celular": "3011234567",
        "correo": "celador.prueba.{{$timestamp}}@example.com"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", function () { pm.response.to.have.status(201); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.id_usuario) pm.environment.set("nuevoCeladorId", json.id_usuario);
      if (json.credenciales_temporales) pm.environment.set("passwordCeladorNuevo", json.credenciales_temporales.password);
    language: text/javascript
order: 18000

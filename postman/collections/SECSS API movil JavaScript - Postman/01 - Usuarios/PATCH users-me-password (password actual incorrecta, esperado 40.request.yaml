$kind: http-request
name: PATCH users/me/password (password actual incorrecta, esperado 401)
url: "{{baseUrl}}/api/mobile/v1/users/me/password"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "password_actual": "esto-no-es-correcto",
      "password_nueva": "{{testPassword}}Otra1"
    }
scripts:
  - type: afterResponse
    code: pm.test("401 esperado", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 7000

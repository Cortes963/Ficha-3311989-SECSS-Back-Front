$kind: http-request
name: PATCH vehicle/{{nuevoVehiculoId}}/inactivar (dueno)
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}/inactivar"
method: PATCH
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000

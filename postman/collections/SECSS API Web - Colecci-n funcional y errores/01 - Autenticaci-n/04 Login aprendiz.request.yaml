$kind: http-request
url: "{{baseUrl}}/api/auth/storeAuthLogin"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenInvitado}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenJefe}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
body:
  type: json
  content: |-
    {
      "numero_documento": "{{docAprendizSemilla}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let j={}; try { j=pm.response.json(); } catch(e) {}
      if (j.token) pm.environment.set("tokenAprendiz", j.token);
      if (j.usuario && j.usuario.id) pm.environment.set("idAprendiz", String(j.usuario.id));
    language: text/javascript
order: 4000

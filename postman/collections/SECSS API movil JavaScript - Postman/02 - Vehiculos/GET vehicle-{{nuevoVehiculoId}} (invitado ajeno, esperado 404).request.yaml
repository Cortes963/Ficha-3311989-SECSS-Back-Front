$kind: http-request
name: GET vehicle/{{nuevoVehiculoId}} (invitado ajeno, esperado 404)
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}"
method: GET
headers:
  Authorization: Bearer {{tokenInvitadoSemilla}}
scripts:
  - type: afterResponse
    code: pm.test("404 esperado (la consulta filtra por dueno)", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 5000

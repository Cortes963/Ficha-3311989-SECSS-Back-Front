$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/reportes"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCelador}}
body:
  type: json
  content: |-
    {
      "asunto": "Vehiculo mal parqueado",
      "cuerpo": "Se encontro una moto obstruyendo la salida de emergencia.",
      "id_entrada_salida": "{{nuevaEntradaId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", function () { pm.response.to.have.status(201); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.id_reporte) pm.environment.set("nuevoReporteId", json.id_reporte);
    language: text/javascript
order: 1000

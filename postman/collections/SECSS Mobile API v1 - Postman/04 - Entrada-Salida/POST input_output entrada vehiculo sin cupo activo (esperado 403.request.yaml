$kind: http-request
name: POST input_output entrada vehiculo sin cupo activo (esperado 403) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/input_output/entrada"
method: POST
headers:
  Authorization: Bearer {{tokenCelador}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_usuario_entra": 5,
      "id_vehiculo": 999999
    }
scripts:
  - type: afterResponse
    code: pm.test("403 sin cupo activo", () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000

$kind: http-request
url: "{{baseUrl}}/api/pqrs/{{nuevaPqrsId}}/respuesta"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenInvitado}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenJefe}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
body:
  type: json
  content: |-
    {
      "asunto": "Respuesta",
      "cuerpo": "Respuesta de prueba."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      let j={}; try {j=pm.response.json();} catch(e) {}
      if (j.id_respuesta) pm.environment.set("nuevaRespuestaId", String(j.id_respuesta));
    language: text/javascript
order: 4000

$kind: http-request
name: GET pqrs/{{nuevaPqrsId}}/respuesta (dueno consulta la respuesta)
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}/respuesta"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", function () { pm.response.to.have.status(200); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.datos && json.datos.id) pm.environment.set("nuevaRespuestaId", json.datos.id);
    language: text/javascript
order: 16000

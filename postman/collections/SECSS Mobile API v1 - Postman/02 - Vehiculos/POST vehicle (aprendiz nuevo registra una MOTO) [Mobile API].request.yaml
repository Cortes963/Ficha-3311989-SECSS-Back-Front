$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/vehicle"
method: POST
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: formdata
  content:
    - type: text
      key: tipo_vehiculo
      value: MOTO
    - type: text
      key: marca
      value: AKT
    - type: text
      key: color
      value: Rojo
    - type: text
      key: placa
      value: TST{{$timestamp}}
    - type: text
      key: cilindraje
      value: "150"
    - type: text
      key: modelo
      value: "2026"

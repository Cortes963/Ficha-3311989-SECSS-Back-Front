$kind: http-request
name: POST pqrs id respuesta de nuevo (esperado 409, ya respondida) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}/respuesta"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "asunto": "Otra",
      "cuerpo": "Segunda respuesta."
    }
scripts:
  - type: afterResponse
    code: pm.test("409 ya respondida", () => pm.response.to.have.status(409));
    language: text/javascript
order: 11000

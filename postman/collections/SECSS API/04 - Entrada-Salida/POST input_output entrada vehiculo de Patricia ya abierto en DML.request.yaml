$kind: http-request
name: POST input_output entrada vehiculo de Patricia ya abierto en DML (esperado 409)
url: "{{baseUrl}}/api/input_output/entrada"
method: POST
headers:
  Authorization: Bearer {{tokenCelador}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_usuario_entra": 9,
      "id_vehiculo": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("409 entrada ya abierta (dato sembrado)", () => pm.response.to.have.status(409));
    language: text/javascript
order: 5000

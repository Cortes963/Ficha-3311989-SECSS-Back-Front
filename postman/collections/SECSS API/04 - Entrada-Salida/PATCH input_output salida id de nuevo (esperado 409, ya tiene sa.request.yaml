$kind: http-request
name: PATCH input_output salida id de nuevo (esperado 409, ya tiene salida)
url: "{{baseUrl}}/api/input_output/salida/{{nuevaEntradaId}}"
method: PATCH
headers:
  Authorization: Bearer {{tokenCelador}}
scripts:
  - type: afterResponse
    code: pm.test("409 ya tiene salida", () => pm.response.to.have.status(409));
    language: text/javascript
order: 8000

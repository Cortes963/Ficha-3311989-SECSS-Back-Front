$kind: http-request
name: PATCH quota con combinacion inexistente (esperado 404) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/quota/999999/999999"
method: PATCH
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("404 cupo no encontrado", () => pm.response.to.have.status(404));
    language: text/javascript
order: 5000

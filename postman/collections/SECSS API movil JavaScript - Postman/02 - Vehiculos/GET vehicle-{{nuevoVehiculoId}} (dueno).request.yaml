$kind: http-request
name: GET vehicle/{{nuevoVehiculoId}} (dueno)
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000

$kind: http-request
url: "{{baseUrl}}/api/users/me"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test("trae detalle_aprendiz", () => pm.expect(pm.response.json().datos.detalle_aprendiz).to.not.be.null);
      }
    language: text/javascript
order: 1000

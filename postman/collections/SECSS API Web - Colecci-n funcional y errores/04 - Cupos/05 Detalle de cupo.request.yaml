$kind: http-request
url: "{{baseUrl}}/api/quota/detalle/{{idAprendiz}}/{{nuevoVehiculoId}}"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000

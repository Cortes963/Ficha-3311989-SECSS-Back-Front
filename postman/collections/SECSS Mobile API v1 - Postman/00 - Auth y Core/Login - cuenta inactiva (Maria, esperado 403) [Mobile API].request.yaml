$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/auth/storeAuthLogin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numero_documento": "T753159",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 cuenta inactiva", () => pm.response.to.have.status(403));
    language: text/javascript
order: 8000

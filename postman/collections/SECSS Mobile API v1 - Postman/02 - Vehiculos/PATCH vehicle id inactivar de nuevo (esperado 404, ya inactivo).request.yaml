$kind: http-request
name: PATCH vehicle id inactivar de nuevo (esperado 404, ya inactivo) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/vehicle/{{nuevoVehiculoId}}/inactivar"
method: PATCH
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: formdata
  content: []
scripts:
  - type: afterResponse
    code: pm.test("404 ya estaba inactivo", () => pm.response.to.have.status(404));
    language: text/javascript
order: 9000

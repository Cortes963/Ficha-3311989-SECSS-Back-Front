$kind: http-request
name: Registro publico INVITADO no permitido (esperado 403) [Mobile API]
url: "{{baseUrl}}/api/mobile/v1/auth/storeAuthRegister"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo_documento": "CC",
      "numero_documento": "{{$timestamp}}2",
      "primer_nombre": "Visitante",
      "primer_apellido": "Postman",
      "n_celular": "320{{$timestamp}}",
      "correo": "invitado.postman.{{$timestamp}}@test.com",
      "password": "{{testPassword}}",
      "nombre_rol": "INVITADO"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 rol no permitido", () => pm.response.to.have.status(403));
    language: text/javascript
order: 14000

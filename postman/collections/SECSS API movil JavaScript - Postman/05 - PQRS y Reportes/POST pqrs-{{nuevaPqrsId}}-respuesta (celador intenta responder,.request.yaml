$kind: http-request
name: POST pqrs/{{nuevaPqrsId}}/respuesta (celador intenta responder, esperado 403)
url: "{{baseUrl}}/api/mobile/v1/pqrs/{{nuevaPqrsId}}/respuesta"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCelador}}
body:
  type: json
  content: |-
    {
      "asunto": "No deberia poder",
      "cuerpo": "El celador no tiene permiso para responder PQRS."
    }
scripts:
  - type: afterResponse
    code: pm.test("403 esperado", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 15000

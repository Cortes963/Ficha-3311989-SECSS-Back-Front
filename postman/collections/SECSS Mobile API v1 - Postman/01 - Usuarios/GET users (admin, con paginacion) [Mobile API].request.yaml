$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/users?pagina=1&limite=10"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
queryParams:
  pagina: "1"
  limite: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("estructura de paginacion", () => {
        const d = pm.response.json();
        pm.expect(d).to.have.property('total');
        pm.expect(d.datos).to.be.an('array');
      });
    language: text/javascript
order: 4000

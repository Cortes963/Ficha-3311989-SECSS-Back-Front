$kind: http-request
name: PATCH quota/{{idAprendizNuevo}}/{{nuevoVehiculoId}} (admin habilita el cupo)
description: Necesario antes de usar el vehiculo en 04 - Entrada-Salida, porque storeInputOutput exige un cupo con estado=1.
url: "{{baseUrl}}/api/mobile/v1/quota/{{idAprendizNuevo}}/{{nuevoVehiculoId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: json
  content: |-
    {
      "estado": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000

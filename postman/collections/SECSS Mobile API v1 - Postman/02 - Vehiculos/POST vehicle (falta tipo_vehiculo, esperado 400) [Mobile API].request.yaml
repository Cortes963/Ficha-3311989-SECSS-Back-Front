$kind: http-request
url: "{{baseUrl}}/api/mobile/v1/vehicle"
method: POST
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: formdata
  content:
    - type: text
      key: marca
      value: X
    - type: text
      key: color
      value: Y
scripts:
  - type: afterResponse
    code: pm.test("400 campo faltante", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000

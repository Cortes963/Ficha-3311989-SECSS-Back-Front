$kind: http-request
name: GET quota/me (aprendiz nuevo)
url: "{{baseUrl}}/api/mobile/v1/quota/me"
method: GET
headers:
  Authorization: Bearer {{tokenAprendizNuevo}}
scripts:
  - type: afterResponse
    code: pm.test("200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000

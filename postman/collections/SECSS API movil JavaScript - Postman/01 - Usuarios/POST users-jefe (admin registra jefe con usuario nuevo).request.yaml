$kind: http-request
name: POST users/jefe (admin registra jefe con usuario nuevo)
url: "{{baseUrl}}/api/mobile/v1/users/jefe"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: json
  content: |-
    {
      "usuario": {
        "tipo_documento": "CC",
        "numero_documento": "{{$timestamp}}",
        "primer_nombre": "Jefe",
        "primer_apellido": "DePrueba",
        "n_celular": "3021234567",
        "correo": "jefe.prueba.{{$timestamp}}@example.com"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", function () { pm.response.to.have.status(201); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.id_usuario) pm.environment.set("nuevoJefeId", json.id_usuario);
    language: text/javascript
order: 20000

$kind: http-request
description: Las imagenes (imagen_url_vehiculo, imagen_url_tarjeta_propiedad, etc.) son opcionales para MOTO/BICICLETA segun el controller, por eso se manda como JSON sin adjuntar archivos. Si quieres probar con imagenes reales, cambia el body a form-data y agrega los campos de tipo file.
url: "{{baseUrl}}/api/mobile/v1/vehicle"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAprendizNuevo}}
body:
  type: json
  content: |-
    {
      "tipo_vehiculo": "MOTO",
      "marca": "Yamaha",
      "color": "Rojo",
      "placa": "ABC12{{$randomInt}}",
      "cilindraje": "125",
      "modelo": "2022"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 creado", function () { pm.response.to.have.status(201); });
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      if (json.id_vehiculo) pm.environment.set("nuevoVehiculoId", json.id_vehiculo);
    language: text/javascript
order: 2000

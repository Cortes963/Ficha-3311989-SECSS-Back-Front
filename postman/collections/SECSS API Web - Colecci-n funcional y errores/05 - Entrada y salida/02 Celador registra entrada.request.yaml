$kind: http-request
url: "{{baseUrl}}/api/input_output/entrada"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenInvitado}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenJefe}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenAdmin}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenCelador}}
  - key: Authorization
    value: Bearer {{tokenAprendiz}}
body:
  type: json
  content: |-
    {
      "id_usuario_entra": "{{idAprendiz}}",
      "id_vehiculo": "{{nuevoVehiculoId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      let j={}; try {j=pm.response.json();} catch(e) {}
      if (j.id_entrada_salida) pm.environment.set("nuevaEntradaId", String(j.id_entrada_salida));
    language: text/javascript
order: 2000
